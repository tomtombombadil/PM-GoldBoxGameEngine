name: Build

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" on the Actions tab (or the API). Fill in a tag (v + the
  # VERSION file, e.g. v0.3.0) to publish a release from the current main -
  # a PRE-release unless "stable" is ticked; leave empty for a plain build.
  # The installer and the port's own Check for Updates take the newest
  # release, pre-releases included.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create = v + the VERSION file, e.g. v0.3.0. Leave empty to just build.'
        required: false
        default: ''
      stable:
        description: 'A stable release (not a pre-release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The port on the runner itself: builds, then runs without a screen and
  # plays back button presses (no game files: the game list, the menu, the
  # messages).
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: No game files in the repo
        run: |
          if git ls-files | grep -Ei '\.(dax|tlb|glb|pdf|exe|ovr|cha|sav|ecl)$'; then
            echo "::error::game files must never be committed"; exit 1
          fi
      - name: Launch script has Unix line ends
        run: |
          for f in "port/Gold Box Game Engine.sh" port/GoldBox.Installer.sh port/goldbox/tools/*.sh; do
            if grep -q $'\r' "$f"; then echo "::error::$f has Windows line ends"; exit 1; fi
            bash -n "$f"
          done
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DPM_STATIC_RUNTIME=OFF
          cmake --build build -j"$(nproc)"
      - name: Run without a screen
        run: python3 tools/smoke_test.py build/goldbox

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build goldbox.${{ matrix.arch }} (Ubuntu 20.04 container)
        run: docker run --rm -v "$PWD":/src ubuntu:20.04 /src/tools/build_in_container.sh ${{ matrix.arch }}
      - name: What was built
        run: file dist/goldbox.${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/goldbox.${{ matrix.arch }}

  package:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Package
        run: python3 tools/package.py && unzip -l dist/goldbox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: goldbox-portmaster
          path: |
            dist/goldbox_port-v*.zip
            dist/goldbox_port-v*.zip.sha256
            dist/GoldBox.Installer.sh
      - name: Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          STABLE: ${{ inputs.stable }}
        run: |
          V="v$(tr -d ' \r\n' < VERSION)"
          if [[ "$TAG" != "$V" ]]; then
            echo "::error::the release tag must be $V - bump VERSION first"; exit 1
          fi
          # This version's part of CHANGELOG.md as the release's notes
          awk -v v="[${V#v}]" 'index($0, "## " v) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Gold Box Game Engine for PortMaster $V" > notes.md
          PRE="--prerelease"; [ "$STABLE" = "true" ] && PRE="--latest"
          gh release create "$TAG" dist/goldbox_port-$V.zip dist/goldbox_port-$V.zip.sha256 dist/GoldBox.Installer.sh \
            --target "$GITHUB_SHA" --title "Gold Box Game Engine $V" --notes-file notes.md $PRE
